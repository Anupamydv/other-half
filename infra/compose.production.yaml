services:
  api:
    image: other-half-api:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN}
      TRUST_PROXY_HOPS: 1
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to a managed PostgreSQL connection}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL to a managed Redis connection}
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:?Set MEDIA_S3_ENDPOINT}
      MEDIA_S3_PUBLIC_ENDPOINT: ${MEDIA_S3_PUBLIC_ENDPOINT:?Set MEDIA_S3_PUBLIC_ENDPOINT}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-us-east-1}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:?Set MEDIA_S3_ACCESS_KEY}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:?Set MEDIA_S3_SECRET_KEY}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-other-half-media}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  web:
    image: other-half-web:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  migration:
    image: other-half-api-migration:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      target: migration
    profiles: [migration]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to a managed PostgreSQL connection}
